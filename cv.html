  <style>
    /* Base */
    body {
      background-color: white;
      font-size: 16px;
      line-height: 1.65;
      padding-top: 132px;
    }

    /* Links */
    a, a:visited, a[href^="mailto:"] { color: #8B0000; } /*#001eff*/

    /* Header */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      /*background: #FFFDF8;*/

      border-bottom: 1px solid #e5e5e5;

    .header-inner { padding: 40px 0 20px 0; }

    .brand a {

    }

    .brand a:hover {

      text-decoration: none;
    }

    .nav-links a {
      color: #71797E;
      padding: 4px 12px;
      font-size: 16px;

      text-decoration: none;
      display: inline-block;
      line-height: 1.2;
    }

    .nav-links a.active {
      color: #000;
      font-weight: 400;
    }

    .nav-links a:hover {
      color: #00b2b2;
      text-decoration: none;
    }

    .cv-link-block {
      text-align: center;
      font-size: 20px;
      margin-top: 80px;
    }

    .cv-link-block a {
      font-weight: 600;
      font-size: 22px;
      color: #8B0000;
      text-decoration: none;
    }

    .cv-link-block a:hover {
      color: #00b2b2;
      text-decoration: none;
    }

    /* CV viewer */
    .cv-wrap {
      text-align: center;
      padding-left: 0;
      padding-right: 0;
    }

    /* Desktop / large screens: big inline viewer */
    .cv-embed {
      display: block;
      width: 100%;
      height: 85vh;
      margin: 0 auto;
      border: none;
    }

    /* Fallback button (hidden by default on desktop) */
    .cv-download {
      display: none;
      margin-top: 40px;
      font-size: 18px;
      padding: 12px 24px;
    }    

    /* Content layout (like your research page) */
    .page-title {

      padding-bottom: 20px;
      margin: 0;
    }

    .content {

      padding-right: 30px;
      text-align: left;
    }

    /* Slightly nicer spacing than <br><br> */
    .outreach-item { margin: 0 0 14px 0; }

    /* Mobile adjustments */
    @media (max-width: 1024px) {
      body { padding-top: 70px; }
      .header-inner { padding: 8px 0; }

      .cv-embed {
        display: none;
      }

      .cv-download {
        display: inline-block;
      }
            
      .content { padding-left: 15px; padding-right: 15px; }
    }

            </div>

            <!-- Mobile burger navigation -->
            <div class="containerMenu mobile-nav">
              <button
                class="containerBar"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                onclick="toggleMenu(this)"
              >
                <span class="bar1"></span>
                <span class="bar2"></span>
                <span class="bar3"></span>
              </button>

              <nav class="BurgerMenu" aria-label="Mobile navigation">
                <a href="/">Home</a>

  <!-- JS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

  <script>
    function toggleMenu(btn) {
      var menu = btn.closest('.containerMenu');
      menu.classList.toggle('change');
      btn.setAttribute('aria-expanded', menu.classList.contains('change'));
    }
    document.addEventListener('click', function(e) {
      var menu = document.querySelector('.containerMenu');
      if (menu && menu.classList.contains('change') && !menu.contains(e.target)) {
        menu.classList.remove('change');
        var btn = menu.querySelector('.containerBar');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });
  </script>

</body>
